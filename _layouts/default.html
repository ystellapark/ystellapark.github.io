<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }}{% if page.title != site.title %} — {{ site.title }}{% endif %}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  {% seo %}
  <link rel="icon" href="{{ '/assets/favicon.png' | relative_url }}" type="image/png">
  <link rel="icon" href="{{ '/assets/favicon.ico' | relative_url }}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{{ '/assets/apple-touch-icon.png' | relative_url }}">
  <link rel="stylesheet" href="{{ '/style.css' | relative_url }}">
</head>
<body>

  <header class="site-header">
    <a href="{{ '/' | relative_url }}" class="site-brand">
      <img src="{{ '/assets/sogang-logo.png' | relative_url }}" alt="Sogang University" class="brand-logo">
    </a>
    <button class="hamburger-btn" aria-label="Menu" onclick="toggleNav()">&#9776;</button>
    <button class="mobile-search-btn" aria-label="Search" onclick="openSearch()">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    </button>
    <nav class="site-nav" id="siteNav">
      <a href="{{ '/' | relative_url }}" {% if page.nav == 'home' %}class="active"{% endif %}>Home</a>
      <a href="{{ '/research.html' | relative_url }}" {% if page.nav == 'research' %}class="active"{% endif %}>Research</a>
      <a href="{{ '/cv.html' | relative_url }}" {% if page.nav == 'cv' %}class="active"{% endif %}>CV</a>
      <span class="nav-search" onclick="openSearch()"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0016 9.5 6.5 6.5 0 109.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg></span>
    </nav>
  </header>

  <!-- Search Overlay -->
  <div class="search-overlay" id="searchOverlay" onclick="closeSearch(event)">
    <div class="search-box" onclick="event.stopPropagation()">
      <input type="text" id="searchInput" placeholder="Search this site" oninput="doSearch(this.value)">
      <div class="search-results" id="searchResults"></div>
    </div>
  </div>

  <main class="page-container">
    {{ content }}
  </main>

  <footer class="site-footer">
    <em>Last Updated: {{ site.time | date: "%B %Y" }}</em>
  </footer>

  <script src="{{ '/search.js' | relative_url }}"></script>
</body>
</html>
