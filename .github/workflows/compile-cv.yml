name: Compile CV from LaTeX

on:
  push:
    paths:
      - 'cv-source/main.tex'
      - 'cv-source/resume.cls'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile LaTeX to PDF
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: cv-source

      - name: Rename output PDF
        run: |
          mv cv-source/main.pdf cv-source/cv.pdf

      - name: Fix PDF metadata
        run: |
          pip install pikepdf
          python3 << 'PYEOF'
          import pikepdf, os

          pdf = pikepdf.open('cv-source/cv.pdf')

          # Print existing metadata for debugging
          print("=== BEFORE ===")
          for k, v in pdf.docinfo.items():
              print(f"  DocInfo {k}: {v}")
          if '/Metadata' in pdf.Root:
              print("  XMP stream exists")

          # Step 1: Delete ALL existing docinfo
          for key in list(pdf.docinfo.keys()):
              del pdf.docinfo[key]

          # Step 2: Remove XMP metadata stream entirely
          if '/Metadata' in pdf.Root:
              del pdf.Root['/Metadata']

          # Step 3: Set fresh docinfo only
          pdf.docinfo['/Title'] = pikepdf.String('Stella Yeayeun Park - CV')
          pdf.docinfo['/Author'] = pikepdf.String('Stella Yeayeun Park')

          # Step 4: Create fresh XMP
          with pdf.open_metadata() as meta:
              meta['dc:title'] = 'Stella Yeayeun Park - CV'
              meta['dc:creator'] = ['Stella Yeayeun Park']

          pdf.save('cv-source/cv_fixed.pdf')
          pdf.close()

          # Verify
          pdf2 = pikepdf.open('cv-source/cv_fixed.pdf')
          print("=== AFTER ===")
          for k, v in pdf2.docinfo.items():
              print(f"  DocInfo {k}: {v}")
          pdf2.close()

          os.replace('cv-source/cv_fixed.pdf', 'cv-source/cv.pdf')
          PYEOF

      - name: Commit compiled PDF
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add cv-source/cv.pdf
          git diff --staged --quiet || git commit -m "Auto-compile CV PDF from LaTeX"
          git push
